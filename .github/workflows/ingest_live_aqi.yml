name: Ingest live AQI data

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: self-hosted
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        timeout-minutes: 3

      - name: Check Python
        timeout-minutes: 1
        run: |
          where python
          python --version

      - name: Create virtual environment and install dependencies
        timeout-minutes: 5
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt

      - name: Run AQI pipeline (fetch, upload, bronze, silver)
        timeout-minutes: 10
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          PYTHONUNBUFFERED: "1"
        run: .venv\Scripts\python ingestion\fetch_live_aqi.py